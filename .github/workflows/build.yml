name: Expo Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v3

      - name: 🏗️ Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Expo Build
        uses: expo/expo-github-action@v8
        with:
          eas-token: ${{ secrets.EXPO_TOKEN }}
          command: build --platform android --profile preview
